<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunstwerk-dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Kunstwerk-dashboard <span id="kw-name"></span></h1>
  <div class="actions">
    <label class="chk"><input type="checkbox" id="rb-placement"> plaatsing opnieuw</label>
    <button id="btn-rebuild" title="kunstwerk_solid + kunstwerk_export draaien (met overrides)">Herbouwen</button>
    <button id="btn-push" title="De draaiende game de wegtegels opnieuw laten ophalen">Naar game</button>
    <span id="game-status" class="pill">game: ?</span>
  </div>
</header>
<main>
  <aside id="left">
    <section>
      <h2>Lagen</h2>
      <div id="layers"></div>
      <label class="chk"><input type="checkbox" id="labels" checked> labels</label>
      <label class="chk"><input type="checkbox" id="arrows" checked> richtingpijlen</label>
    </section>
    <section>
      <h2>Street View</h2>
      <select id="sv-place"></select>
      <div id="sv-info" class="muted"></div>
      <div id="legend"></div>
    </section>
    <section>
      <h2>Zoeken</h2>
      <input id="search" placeholder="id, code of label…">
      <div id="search-results"></div>
    </section>
    <section class="muted small" id="frame-note"></section>
  </aside>
  <div id="view">
    <div id="hud" class="muted small"></div>
    <div id="loading">laden…</div>
  </div>
  <aside id="right">
    <h2>Inspector</h2>
    <div id="inspector" class="muted">Klik een object of camerapositie aan.</div>
  </aside>
</main>
<footer>
  <div class="log-head"><span>Log</span><span id="log-status"></span><button id="log-toggle">▾</button></div>
  <pre id="log"></pre>
</footer>
<script type="module" src="/static/app.js"></script>
</body>
</html>
